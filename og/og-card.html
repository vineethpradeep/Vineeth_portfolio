<!doctype html>
<!-- Source for public/og-image.png (1200x630). Regenerate with: node og/render.mjs -->
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500&family=Stack+Sans+Headline:wght@500&family=Stack+Sans+Notch:wght@500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #202020;
    background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 24px 24px;
    color: #fff;
    font-family: "Stack Sans Headline", Arial, sans-serif;
  }
  .glow { position: absolute; right: -80px; top: 40px; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(200,22,29,0.35), rgba(200,22,29,0) 65%); }
  .top { position: absolute; left: 64px; right: 64px; top: 52px; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 30px; font-weight: 500; letter-spacing: -0.01em; }
  .status { display: inline-flex; align-items: center; gap: 12px; padding: 9px 16px 9px 0; border: 1px solid #fff;
    font: 500 15px "JetBrains Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; }
  .status i { width: 9px; height: 14px; margin-left: 16px; background: #c8161d; }
  .role { position: absolute; left: 64px; top: 170px; font: 500 18px "JetBrains Mono", monospace;
    letter-spacing: 0.06em; text-transform: uppercase; color: #c8161d; }
  h1 { position: absolute; left: 60px; top: 214px; width: 600px; font-size: 66px; font-weight: 500;
    line-height: 0.98; letter-spacing: -0.02em; text-transform: uppercase; }
  h1 em { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400;
    text-transform: none; color: #c8161d; font-size: 1.12em; letter-spacing: 0; }
  .foot { position: absolute; left: 64px; right: 64px; bottom: 50px; display: flex; justify-content: space-between;
    font: 500 16px "JetBrains Mono", monospace; letter-spacing: 0.05em; text-transform: uppercase; color: rgba(255,255,255,0.7); }
  .frame { position: absolute; right: 64px; top: 150px; width: 430px; border-radius: 8px; overflow: hidden;
    background: #2b2b2b; border: 1px solid rgba(255,255,255,0.25); transform: rotate(4deg);
    box-shadow: 0 40px 80px -30px rgba(0,0,0,0.8); }
  .bar { height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 12px; border-bottom: 1px solid rgba(255,255,255,0.2); }
  .bar i { width: 9px; height: 9px; border-radius: 50%; background: #555; }
  .bar span { margin-left: auto; margin-right: auto; padding: 2px 14px; border-radius: 99px; background: #202020;
    font: 12px "JetBrains Mono", monospace; color: rgba(255,255,255,0.6); }
  .frame img { display: block; width: 100%; aspect-ratio: 16/10; object-fit: cover; object-position: top; }
  .frame.back { right: 150px; top: 230px; transform: rotate(-6deg); opacity: 0.55; width: 380px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="top">
    <div class="logo">VINEETH</div>
    <div class="status"><i></i>Open to roles &amp; projects</div>
  </div>
  <p class="role">Solutions Architect &amp; Full-Stack Developer</p>
  <h1>Business solutions, <em>architected</em> with AI.</h1>
  <div class="frame back"><div class="bar"><i></i><i></i><i></i><span>dev.qthemindmath.com</span></div><img src="../public/work/portfolio_20.jpg" /></div>
  <div class="frame"><div class="bar"><i></i><i></i><i></i><span>dev.qthe.co.uk</span></div><img src="../public/work/portfolio_21.jpg" /></div>
  <div class="foot"><span>React · Next.js · .NET · Azure · AI agents</span><span>vineethjourney.vercel.app</span></div>
</body>
</html>
